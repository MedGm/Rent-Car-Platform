upstream frontend_http {
    server frontend:3000;
}

upstream backend_http {
    server backend:5000;
}

# HTTP only — used during initial SSL certificate acquisition
server {
    listen 80;
    server_name mistersdrivers.com www.mistersdrivers.com;

    # Let's Encrypt verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Proxy everything else normally during cert setup
    location /api/ {
        proxy_pass http://backend_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/uploads/ {
        proxy_pass http://backend_http;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
